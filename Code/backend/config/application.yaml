# Unified Backend Automation — Application configuration
# Linux Production Configuration

# -------------------------------------------------
# Logging — multi-file routing (logging-only; does not affect bidding)
# -------------------------------------------------
# general/:          complete lifecycle (every logger record)
# execution_phase/:  valid bid → timer → fill → Save/Yes/OK → rank → post-exec
# monitoring/:       monitor cycles, search, plan, valid/no-valid bid
# timer/:            timer poll / EXEC trigger evaluation
# rank/:             rank poll / updates
# rotation/:         window rotation / freeze
# start_in/:         Start In observer (.log; JSONL also written by observer)
# errors/:           WARNING+ / exceptions only
# jobs/:             job store (unchanged)
logging:
  general_log_file_enabled: true
  general_log_dir: "logs/All_logs"
  general_console_enabled: false

  execution_phase_file_enabled: true
  execution_phase_dir: "logs/All_logs"

  monitoring_log_enabled: false
  monitoring_log_dir: "logs/monitoring"

  timer_log_enabled: false
  timer_log_dir: "logs/timer"

  rank_log_enabled: false
  rank_log_dir: "logs/rank"

  rotation_log_enabled: false
  rotation_log_dir: "logs/rotation"

  start_in_log_file_enabled: false
  start_in_log_dir: "logs/start_in"

  errors_log_enabled: false
  errors_log_dir: "logs/errors"

# -------------------------------------------------
# Execution-centric logging (All_logs) — additive; legacy fan-out unchanged
# Override: EXECUTION_LOGGING_ENABLED=true|false
# Override: EXECUTION_LOGGING_ROOT=logs/All_logs
# -------------------------------------------------
execution_logging:
  enabled: false
  all_logs_root: "logs/All_logs"
  legacy_fanout_unchanged: true
  timer_heartbeat_seconds: 5.0
  timer_info_raw_polls: false
  console_echo: false

# -------------------------------------------------
# SAP Configuration
# -------------------------------------------------
sap:
  base_url: "https://rise.eye2serve.com:8443/sap/bc/ui5_ui5/ui2/ushell/shells/abap/FioriLaunchpad.html?saml2=disabled"
  launchpad_url: "https://rise.eye2serve.com:8443/sap/bc/ui5_ui5/ui2/ushell/shells/abap/FioriLaunchpad.html?saml2=disabled&sap-client=300&sap-language=EN#Shell-home"
  # Vendor app (same view as Shubh Carrier after tile click)
  bidding_url: "https://rise.eye2serve.com:8443/sap/bc/ui5_ui5/sap/zvc_vendor_app/index.html#/ebidding"
  # Default depots for sequential multi-depot processing (API can override)
  depots: []
  # Open E-Bidding by clicking launchpad tile (opens new tab); if false, navigate to bidding_url
  open_via_tile: true
  e_bidding_tile_id: "__content8"
  ship_from_plant: "TANDA CEMENT WORKS"
  bid_discount_percent: 2
  # Header "Show Search" (upper-right): set header_show_search_button_id if you have its ID from devtools
  header_show_search_button_id: null
  # Go/initial button (after expanding Show Search) — often same as __button0
  initial_search_button_id: "__button0-BDI-content"
  ship_from_plant_field_id: "__xmlview0--ididUtclVCShipFromPlant-inner"
  depot_field_id: "__xmlview0--idUtclVCDepot-inner"
  search_button_id: "__button3-BDI-content"
  # Order List results table (optional; used after Search is clicked)
  results_table_id: "__xmlview0--idUtclVCVendorAssignmentTable-tblBody"
  # SPI column (same row_index as bid amount): full inner id template, OR token that replaces idBidAmount in bid id
  spi_inner_element_id_template: null
  spi_inner_id_replace_bid_control_token: null
  # If true, click search again after timer to refresh table before submitting bids
  click_search_after_timer: false

# -------------------------------------------------
# SAP "Reduce your bid by minimum Rs. X from L1" popup handling
# Effective reduction = max(SAP minimum, configured_reduction_amount) + safety_margin
# (a configured value below SAP's minimum is never used). Optional table.cell_indices.l1_bid
# selects the L1 amount column (defaults to base_price).
# -------------------------------------------------
bid_reduction:
  auto_handle_minimum_reduction: true
  configured_reduction_amount: 0
  safety_margin: 0
  max_bid_retry_attempts: 2          # hard cap 5; 0 = detect and stop only
  require_confirmation_for_exact_bid_conflicts: true

# -------------------------------------------------
# Live bid monitoring (sequential per depot)
# -------------------------------------------------
# Total time (seconds) to keep re-searching per depot when no rows are found.
# Set 0 (or negative) for continuous monitoring without timeout.
live_monitor_total_seconds: 0
# Delay (seconds) between searches during monitoring
live_monitor_poll_seconds: 4

# -------------------------------------------------
# Retry & Timer Settings
# -------------------------------------------------
# Delay between attempts in _run_search_with_retry only (not the live monitor 4s cadence).
search_retry_interval_seconds: 10
# Shubh parity: timer trigger strings are hardcoded in depot_bidding_engine._is_execute_timer_text
# (Starts in 0:0:3|2|1|0 OR substring "Expires in"). Poll interval for that loop only:
timer_poll_interval_seconds: 0.1
timer_element_id: "__xmlview0--timer-inner"

# -------------------------------------------------
# Timeout Configuration
# -------------------------------------------------
page_load_timeout_seconds: 60
element_wait_timeout_seconds: 20
post_login_wait_seconds: 8
implicit_wait_seconds: 10

# -------------------------------------------------
# Parallel Execution
# -------------------------------------------------
parallel:
  max_workers: 4
  shutdown_timeout_seconds: 90

# -------------------------------------------------
# Automation orchestration
# -------------------------------------------------
# legacy = one WebDriver + process_parallel_tabs (cooperative tabs)
# multiprocess = ProcessPoolExecutor + run_depot_worker (one OS process + Chrome per depot)
# Override: AUTOMATION_EXECUTION_MODE=legacy|multiprocess
automation:
  execution_mode: multiprocess
  multiprocess:
    max_parallel_workers: null
    max_parallel_workers_absolute_cap: 16
    # Sequential launch: wait this many seconds after starting each depot worker before launching the next.
    # Depot 1 starts immediately; depot 2 after login_stagger_seconds; depot 3 after another interval; etc.
    # Override: AUTOMATION_LOGIN_STAGGER_SECONDS=210
    login_stagger_seconds: 210
    worker_retry_attempts: 2
    depot_timeout_seconds: null
    # After depot automation: keep Chrome + SAP session (no driver.quit). Set false to close browser after each depot (legacy).
    keep_browser_open: true
    # If true, keep browser open only when automation_executed (bid submit ran); else same as keep_browser_open for any successful depot run
    keep_browser_open_only_after_automation: false
    # passive = heartbeat only; monitor = read-only timer text (no bids / no search)
    post_execute_mode: passive
    post_execute_interval_seconds: 5
    # null = run until process is stopped (or orchestrator timeout kills worker)
    post_execute_max_seconds: null

# -------------------------------------------------
# Operator Chrome window rotation (UI visibility only)
# Phase 1: round-robin foreground every interval_seconds
# Phase 2: freeze switching while any live_bids leg is executing / waiting_rank
# Does NOT affect bidding / Search / timer / execute / rank.
# Starts only when enabled AND more than one depot is in the job.
# Override: WINDOW_ROTATION_ENABLED=true|false
# Override: WINDOW_ROTATION_INTERVAL_SECONDS=5
# Override: WINDOW_ROTATION_FREEZE_ON_EXECUTION=true|false
# -------------------------------------------------
window_rotation:
  enabled: true
  interval_seconds: 5
  freeze_on_execution: true

# -------------------------------------------------
# Start In observer (SAP sync investigation only)
# Independent of bidding: does not Search / plan / execute / rank.
# While "Starts in" is visible: log every sample_interval_seconds.
# Freeze alert after freeze_unchanged_samples consecutive identical remainings.
# Override: START_IN_OBSERVER_ENABLED=true|false
# -------------------------------------------------
start_in_observer:
  enabled: true
  sample_interval_seconds: 5
  poll_interval_seconds: 0.5
  freeze_unchanged_samples: 2

# -------------------------------------------------
# Browser Configuration (Chrome)
# -------------------------------------------------
browser:
  type: chrome
  headless: false
  binary_path: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  window_size: "1920,1080"
  remote_debugging_port: 9222
  proxy: null                     # example: "http://username:password@proxy_ip:port"
  chromedriver_path: null
  chromedriver_create_retries: 6
  chromedriver_retry_base_delay_seconds: 2.0

